networks:
  decoy_net:
    driver: bridge
    internal: false

services:
  ssh:
    build:
      context: ./docker
      dockerfile: Dockerfile.ssh
    image: janus-ssh:latest
    container_name: janus-ssh
    ports:
      - "2222:2222"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [decoy_net]
    restart: unless-stopped
    command: python /app/docker/ssh_entrypoint.py

  http:
    build:
      context: ./docker
      dockerfile: Dockerfile.http
    image: janus-http:latest
    container_name: janus-http
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks: [decoy_net]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.3"
    volumes:
      - ./logs/http:/usr/local/apache2/logs
    restart: unless-stopped

  ftp:
    build:
      context: ./docker
      dockerfile: Dockerfile.ftp
    image: janus-ftp:latest
    container_name: janus-ftp
    ports:
      - "${FTP_PORT:-2121}:21"
      - "30000-30009:30000-30009"
    environment:
      # Bos birakilabilir (otomatik / EPSV). Eski PASV istemcileri icin
      # .env'de FTP_PASV_ADDRESS=<host-ip> verilerek override edilebilir.
      - FTP_PASV_ADDRESS=${FTP_PASV_ADDRESS:-}
    networks: [decoy_net]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, FSETID, KILL, SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: "0.5"
    volumes:
      - ./logs/ftp:/var/log/vsftpd
    restart: unless-stopped

